name: Build Release

on:
  push:
    branches: [ main ]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet -tags with_quic,with_grpc,with_utls ./...

      - name: go test
        run: go test -count=1 -tags with_quic,with_grpc,with_utls ./internal/...

      - name: go test (race)
        # 开发者本机多为 Windows 且无 gcc，-race 在本地跑不了；
        # ubuntu runner 自带 gcc，CGO 可用，竞态检测只能靠 CI 兜。
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -tags with_quic,with_grpc,with_utls ./internal/...

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
            gui: 'true'
          - os: windows-latest
            target: windows-arm64
            goos: windows
            goarch: arm64
            ext: .exe
            gui: 'true'
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            gui: 'false'
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            gui: 'false'
          - os: macos-latest
            target: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            gui: 'false'
          - os: macos-latest
            target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            gui: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        # 构建标签开启 sing-box 的 QUIC(hysteria/hysteria2/tuic)、grpc 传输与
        # uTLS 指纹支持; 缺省构建不含这些协议栈。
        # naive 出站依赖 Chromium cronet 原生库, 与纯 Go 交叉编译不兼容, 不启用
        run: |
          if [ "${{ matrix.gui }}" = "true" ]; then
            LDFLAGS="-s -w -H=windowsgui"
          else
            LDFLAGS="-s -w"
          fi
          go build -tags with_quic,with_grpc,with_utls -ldflags="$LDFLAGS" -o cline-proxy-${{ matrix.target }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-proxy-${{ matrix.target }}
          path: cline-proxy-${{ matrix.target }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cline-proxy-*

      - name: Generate semantic release tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LATEST" ]; then
            TAG="v0.0.1"
          else
            VERSION="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated semantic version: $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/cline-proxy-*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
