name: Build Release

on:
  push:
    branches: [ main ]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet -tags with_quic,with_grpc,with_utls ./...

      - name: go test
        run: go test -count=1 -tags with_quic,with_grpc,with_utls ./internal/...

      - name: go test (race)
        # 开发者本机多为 Windows 且无 gcc，-race 在本地跑不了；
        # ubuntu runner 自带 gcc，CGO 可用，竞态检测只能靠 CI 兜。
        #
        # CLINE_PROXY_SKIP_NODEBOX: 让测试不实例化真实 sing-box。sing-box 的 Box
        # 起来后会拉起自己的后台 goroutine(网络接口监听 / systemd-resolved DBus),
        # 这些第三方内部实现之间存在数据竞争 —— 实测报了 15 处, 全部在
        # route.NetworkManager.Start 与 updateInterface 之间, 没有一处涉及本仓库
        # 代码。它们无法在网关侧修掉, 却会让这个任务整体变红, 反而掩盖我们自己
        # 代码里的真正问题。需要真实实例的用例会自行 t.Skip, 它们仍由上面的
        # 「go test」步骤覆盖(不设该变量)。
        env:
          CGO_ENABLED: '1'
          CLINE_PROXY_SKIP_NODEBOX: '1'
        run: go test -race -count=1 -tags with_quic,with_grpc,with_utls ./internal/...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend admin render test
        # scripts/admin-render-test.js 是纯 Node 零依赖的渲染冒烟测试(104+ 断言),
        # 覆盖 admin_html.go 嵌入的 2300+ 行管理后台 HTML/JS。前端改坏必须让 CI 红。
        run: node scripts/admin-render-test.js

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
            gui: 'true'
          - os: windows-latest
            target: windows-arm64
            goos: windows
            goarch: arm64
            ext: .exe
            gui: 'true'
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            gui: 'false'
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            gui: 'false'
          - os: macos-latest
            target: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            gui: 'false'
          - os: macos-latest
            target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            gui: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Compute build version
        id: ver
        shell: bash
        # 版本必须在此处(构建前)就算出, 否则 release job 才生成 tag 时构建拿不到。
        # 取最近 tag + commit 偏移; 无 tag 时回退到 commit hash, 保证任何构建都可区分。
        run: |
          set -euo pipefail
          git fetch --tags --force || true
          VER=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Build version: $VER"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        # 构建标签开启 sing-box 的 QUIC(hysteria/hysteria2/tuic)、grpc 传输与
        # uTLS 指纹支持; 缺省构建不含这些协议栈。
        # naive 出站依赖 Chromium cronet 原生库, 与纯 Go 交叉编译不兼容, 不启用。
        # buildVersion 注入后 /health(version) 可区分不同构建。
        run: |
          if [ "${{ matrix.gui }}" = "true" ]; then
            LDFLAGS="-s -w -H=windowsgui"
          else
            LDFLAGS="-s -w"
          fi
          LDFLAGS="$LDFLAGS -X cline-go-proxy/internal/app.buildVersion=${{ steps.ver.outputs.version }}"
          go build -tags with_quic,with_grpc,with_utls -ldflags="$LDFLAGS" -o cline-proxy-${{ matrix.target }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-proxy-${{ matrix.target }}
          path: cline-proxy-${{ matrix.target }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cline-proxy-*

      - name: Generate sha256 checksums
        shell: bash
        # 发布包未签名(41.7MB exe 会被 SmartScreen 拦), 用户需要完整性校验手段。
        # 生成每份产物平行的 .sha256 文件 + 一份汇总 checksums.txt。
        run: |
          set -euo pipefail
          cd artifacts
          : > ../checksums.txt
          find . -type f -name 'cline-proxy-*' | sort | while read -r f; do
            h=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$h  ${f#./}" >> ../checksums.txt
            echo "$h" > "$f.sha256"
          done
          cat ../checksums.txt

      - name: Generate semantic release tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LATEST" ]; then
            TAG="v0.0.1"
          else
            VERSION="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated semantic version: $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/cline-proxy-*/*
            checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
